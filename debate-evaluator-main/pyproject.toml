[project]
name = "debate-evaluator"
version = "0.1.0"
description = "토론 담론 품질 평가 시스템 - OpenAI GPT-4o 기반 4가지 평가 방법론(DQI, AAF, DQI-AAF, AFRA) 지원"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "AI Thought Partner" }
]
keywords = ["debate", "evaluation", "nlp", "discourse", "openai", "dqi", "aaf", "afra"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai>=1.0.0,<2.0.0",
    "anthropic>=0.18.0",
    "google-genai>=0.2.0",
    "groq>=0.4.0",
    "dashscope>=1.17.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
debate-eval = "debate_evaluator.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debate_evaluator"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
